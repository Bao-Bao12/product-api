name: CD

on:
  workflow_run:
    workflows: ["Product CI Prod"]
    types: [completed]
    branches: [main]

jobs:
  push-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.event.workflow_run.head_sha }}
    deploy-local:
    needs: push-image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Kéo image mới và khởi động
        shell: powershell
        run: |
          docker compose -f docker-compose-prod.yaml pull
          docker compose -f docker-compose-prod.yaml up -d

      - name: Chờ healthy và kiểm tra
        shell: powershell
        run: |
          Start-Sleep -Seconds 25
          docker compose -f docker-compose-prod.yaml ps
          curl.exe --fail http://localhost:3000/health